# AgentFlow desktop app: the Rust rewrite of backend/.
# Checked against the Python backend by the black-box suite in contract/.
[workspace]
resolver = "3"
members = ["crates/core", "crates/flowctl", "crates/pyjson", "crates/server"]
# Keep the optional desktop dependency tree separate until its dependencies and native build
# have been validated. It uses the same core; ordinary offline backend builds remain available.
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: flowctl prints and posts JSON objects in the order they were written, like Python.
# float_roundtrip: numbers parse to the nearest double, as Python parses them (the default fast path
# can be one bit off for long digit strings, which would change values read from data files).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
ureq = { version = "2.12", default-features = false, features = ["json"] }
indexmap = { version = "2", features = ["serde"] }
# bundled: SQLite is compiled in, so the app does not depend on a system library.
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
sha2 = "0.10"
serde_path_to_error = "0.1"
tokio = { version = "1", features = ["process", "time", "rt-multi-thread", "macros", "io-util", "fs", "sync", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
url = "2"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-stream = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
unicode-general-category = "1"
# Embedded terminals: ConPTY on Windows, and a headless screen model for classification.
portable-pty = "0.9"
vt100 = "0.16"
# The loopback HTTP API (UI routes, /api/ws, agent routes).
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
# Pairing codes and session tokens (Python's secrets.token_urlsafe).
getrandom = "0.4"
base64 = "0.23"
# The engine holds terminal backends as trait objects (and tests a recording fake).
async-trait = "0.1"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_JobObjects", "Win32_System_Kernel", "Win32_Security", "Wdk_System_Threading"] }
tempfile = "3"
pyjson = { path = "crates/pyjson" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
