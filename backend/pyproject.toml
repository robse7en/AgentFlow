[project]
name = "agentflow"
version = "0.1.0"
description = "AgentFlow - local human-gated AI engineering workflow orchestrator"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# Slack DMs over Socket Mode (see docs/slack.md); aiohttp backs the async socket client.
slack = ["slack_bolt>=1.18", "aiohttp>=3.9"]

[project.scripts]
flowctl = "agentflow.cli.flowctl:main"
agentflow = "agentflow.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
