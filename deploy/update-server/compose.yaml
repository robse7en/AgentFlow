# Static update server for the AgentFlow desktop. Build installers with
# scripts/build-desktop-installer.ps1 -UpdateUrl http://<this-host>:<port> -PublishTo <releases folder>.
name: agentflow-update-server
services:
  agentflow-update-server:
    image: nginx:1.27-alpine
    container_name: agentflow-update-server
    restart: unless-stopped
    ports:
      - "${AGENTFLOW_UPDATE_PORT:-8080}:80"
    volumes:
      - "${AGENTFLOW_RELEASES_DIR:-./releases}:/usr/share/nginx/html:ro"
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
